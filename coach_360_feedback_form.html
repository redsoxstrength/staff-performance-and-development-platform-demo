<script>
// Service workers are intentionally NOT used in this build (see README) --
// iOS Safari's background-suspend handling for an active service worker
// was the likely cause of the tap/button "freeze" reported on iPhone.
// This just cleans up any registration a phone/browser may already have
// picked up from an earlier version of this package; it does not register
// a new one.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    regs.forEach(function(reg) { reg.unregister(); });
  }).catch(function(){});
}
</script>

<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colleague Development Input</title>
<style>
:root {
    color-scheme: light;
  --rs-red: #BD3039;
  --rs-red-dark: #8C2128;
  --rs-navy: #0C2340;
  --rs-navy-light: #1A3357;
  --ink: #1a1a1a;
  --ink-soft: #555;
  --ink-mute: #888;
  --line: #e5e7eb;
  --line-soft: #f1f3f5;
  --bg: #fafbfc;
  --card: #ffffff;
  --pill-bg: #f4f5f7;
  --pill-hover: #ebedf0;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
  --shadow-lift: 0 4px 12px rgba(12,35,64,0.10), 0 12px 28px rgba(12,35,64,0.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* TOPBAR */
.topbar {
  background: var(--rs-navy);
  color: #fff;
  padding: 14px 28px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 3px solid var(--rs-red);
}
.topbar .crest {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: #fff;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.topbar .brand { font-size: 14px; letter-spacing: 0.3px; opacity: 0.95; }
.topbar .brand b { letter-spacing: 0.5px; }
.topbar .brand .sep { opacity: 0.5; margin: 0 6px; }

/* SHELL — fluid width that scales aggressively with viewport.
   Caps at 1200px so wide monitors get a comfortable but not absurd width. */
.shell {
  width: 100%;
  max-width: min(1200px, 94%);
  margin: 0 auto;
  padding: clamp(18px, 3vw, 36px) clamp(14px, 2vw, 32px) 80px;
}
@media (max-width: 600px) {
  .topbar { padding: 12px 16px; }
}

/* STAGE PROGRESS */
.stage-bar { display: flex; gap: 6px; margin-bottom: 22px; }
.stage-bar .pip {
  flex: 1;
  height: 4px;
  background: var(--line);
  border-radius: 2px;
  transition: background 0.2s;
}
.stage-bar .pip.done { background: var(--rs-navy); }
.stage-bar .pip.active { background: var(--rs-red); }

/* CARDS — padding scales with viewport */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: clamp(20px, 3vw, 36px);
  box-shadow: var(--shadow);
}

.eyebrow {
  font-size: 11px;
  letter-spacing: 1.5px;
  font-weight: 700;
  color: var(--rs-red);
  margin-bottom: 8px;
  text-transform: uppercase;
}
h1 { font-size: 26px; margin: 0 0 12px; color: var(--rs-navy); letter-spacing: -0.2px; }
h2 { font-size: 18px; margin: 18px 0 8px; color: var(--rs-navy); letter-spacing: -0.2px; }
h3 { font-size: 15px; margin: 0 0 6px; color: var(--ink); font-weight: 600; }
p { margin: 0 0 14px; color: var(--ink-soft); }
.muted { color: var(--ink-mute); font-size: 13px; }

/* SAFETY COVENANT BOX */
.covenant {
  background: #EDF1F6;
  border-left: 4px solid var(--rs-navy);
  border-radius: 0 8px 8px 0;
  padding: 16px 18px;
  margin: 16px 0 20px;
  font-size: 13px;
  line-height: 1.65;
  color: var(--ink);
}
.covenant b { color: var(--rs-navy); }

/* FORM FIELDS */
.field { margin-bottom: 22px; }
.field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 6px;
}
.field .hint {
  font-size: 12px;
  color: var(--ink-mute);
  margin-bottom: 8px;
  line-height: 1.55;
}
.field input[type=text], .field select {
  width: 100%;
  font-family: inherit;
  font-size: 15px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
}
.field input[type=text]:focus, .field select:focus {
  outline: none;
  border-color: var(--rs-navy);
  box-shadow: 0 0 0 3px rgba(12,35,64,0.10);
}

/* Textareas — applied to ALL textareas in the form (both .field and .q-block).
   Generous height by default to encourage longer answers and let the writer see
   what they have said as they go. Resizes vertical if they need more. */
.shell textarea {
  display: block;
  width: 100%;
  box-sizing: border-box;
  font-family: inherit;
  font-size: 15px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
  min-height: 220px;
  resize: vertical;
  line-height: 1.65;
}
.shell textarea.tall { min-height: 280px; }
.shell textarea:focus {
  outline: none;
  border-color: var(--rs-navy);
  box-shadow: 0 0 0 3px rgba(12,35,64,0.10);
}

/* Question block — two-column header / textarea layout */
.q-block {
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line-soft);
}
.q-block:last-of-type { border-bottom: none; padding-bottom: 0; }
.q-block .q-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--rs-navy);
  margin-bottom: 4px;
}
.q-block .q-frame {
  font-size: 12px;
  color: var(--ink-mute);
  font-style: italic;
  margin-bottom: 10px;
  line-height: 1.55;
}

/* Relationship pill row */
.pill-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.pill {
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-soft);
  background: var(--pill-bg);
  border: 1px solid var(--line);
  padding: 8px 14px;
  border-radius: 100px;
  cursor: pointer;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.pill:hover { background: var(--pill-hover); }
.pill.selected {
  background: var(--rs-navy);
  color: #fff;
  border-color: var(--rs-navy);
}

/* Likert scale block — sits under each scored textarea.
   1-5 pill row + anchor descriptions. Optional. */
.scale-block {
  margin-top: 14px;
  padding: 14px 16px;
  background: var(--line-soft);
  border-radius: 8px;
}
.scale-block .scale-prompt {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 8px;
}
.scale-block .scale-prompt .scale-optional {
  font-weight: 500;
  color: var(--ink-mute);
  font-size: 12px;
  margin-left: 6px;
}
.scale-pills-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.scale-num-pill {
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink-soft);
  background: #fff;
  border: 1px solid var(--line);
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  min-width: 42px;
  transition: background 0.12s, color 0.12s, border-color 0.12s, transform 0.05s;
}
.scale-num-pill:hover { background: var(--pill-hover); border-color: var(--ink-mute); }
.scale-num-pill:active { transform: translateY(1px); }
.scale-num-pill.selected {
  background: var(--rs-navy);
  color: #fff;
  border-color: var(--rs-navy);
}
.scale-anchors {
  font-size: 11px;
  color: var(--ink-mute);
  font-style: italic;
  line-height: 1.5;
}
.scale-anchors b { color: var(--ink); font-style: normal; font-weight: 700; }

/* NAV BUTTONS */
.nav-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 28px;
}
.btn {
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  padding: 11px 22px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.12s, transform 0.05s;
  border: none;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--rs-red); color: #fff; }
.btn-primary:hover { background: var(--rs-red-dark); }
.btn-primary:disabled { background: #c4a8aa; cursor: not-allowed; }
.btn-ghost {
  background: transparent;
  color: var(--ink-soft);
  border: 1px solid var(--line);
}
.btn-ghost:hover { background: var(--pill-bg); }
.btn-link {
  background: transparent;
  color: var(--rs-navy);
  border: none;
  text-decoration: underline;
  font-size: 13px;
  padding: 6px 0;
  cursor: pointer;
}
.btn-big { font-size: 16px; padding: 14px 28px; }

.error-msg {
  color: var(--rs-red);
  font-size: 13px;
  margin-top: 8px;
  font-weight: 600;
}

/* REVIEW SUMMARY */
.summary-section { margin-bottom: 18px; }
.summary-section h4 {
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--rs-red);
  margin: 0 0 8px;
  font-weight: 700;
}
.summary-row {
  display: grid;
  grid-template-columns: 130px 1fr;
  padding: 6px 0;
  font-size: 13px;
  color: var(--ink-soft);
}
.summary-row b { color: var(--ink); font-weight: 600; }
.summary-block {
  margin-bottom: 8px;
  padding: 10px 12px;
  background: var(--line-soft);
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.6;
  font-style: italic;
  color: var(--ink-soft);
}
.summary-empty {
  margin-bottom: 8px;
  padding: 8px 12px;
  color: var(--ink-mute);
  font-size: 12px;
  font-style: italic;
}

/* CONFIRMATION */
.confirm-state { text-align: center; padding: 20px 0; }
.confirm-state .check {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: #2e7d32;
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  margin: 0 auto 16px;
}

/* DOWNLOAD CONFIRMATION CARD — shows the file that was saved */
.download-confirm {
  background: #E8F5E9;
  border: 1px solid #A5D6A7;
  border-radius: 8px;
  padding: 14px 18px;
  margin: 16px 0 20px;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 14px;
}
.download-confirm .dc-icon {
  font-size: 28px;
  flex-shrink: 0;
}
.download-confirm .dc-text { font-size: 13px; color: #1B5E20; line-height: 1.55; }
.download-confirm code {
  display: inline-block;
  background: #fff;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 12px;
  color: var(--ink);
  margin-top: 4px;
}

/* STEP LIST — numbered, prominent, text-left */
.step-list { text-align: left; margin: 20px 0; }
.step-item {
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 14px;
  align-items: flex-start;
  padding: 14px 0;
  border-bottom: 1px solid var(--line-soft);
}
.step-item:last-child { border-bottom: none; }
.step-num {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--rs-red);
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.step-item.critical .step-num { background: #ed8c00; }
.step-text { font-size: 14px; line-height: 1.6; color: var(--ink); }
.step-text .step-title { font-weight: 700; color: var(--rs-navy); margin-bottom: 4px; display: block; }
.step-text .step-detail { color: var(--ink-soft); font-size: 13px; }
.step-text code {
  background: var(--line-soft);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 12px;
  color: var(--ink);
}
.step-item.critical .step-text .step-title { color: #C76B00; }

/* AUTOSAVE */
.autosave {
  position: fixed;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  right: calc(16px + env(safe-area-inset-right, 0px));
  background: var(--rs-navy);
  color: #fff;
  font-size: 12px;
  padding: 8px 14px;
  border-radius: 20px;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  box-shadow: var(--shadow-lift);
}
.autosave.show { opacity: 0.95; }

/* RESUME BANNER */
.resume-banner {
  background: #fff8e1;
  border: 1px solid #f5c34b;
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 20px;
  font-size: 13px;
  color: #6b4f0c;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.resume-banner button {
  background: #6b4f0c;
  color: #fff;
  border: none;
  padding: 6px 12px;
  border-radius: 5px;
  font-size: 12px;
  cursor: pointer;
  font-weight: 600;
}

/* RESULT DOCUMENT — the formatted page that becomes the PDF handed to the
   Coordinator. Visible on screen on the confirm stage so it can be checked
   before printing; on print, everything else on the page is hidden and this
   is what fills the page. */
.result-doc {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 40px 44px;
  max-width: 760px;
  margin: 0 auto;
}
.result-doc .doc-rule { height: 4px; background: var(--rs-red); margin: 0 0 18px; }
.result-doc .doc-eyebrow { font-size: 11px; letter-spacing: 1.5px; font-weight: 700; color: var(--rs-red); text-transform: uppercase; margin-bottom: 6px; }
.result-doc h1 { margin: 0 0 4px; }
.result-doc .doc-sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 22px; }
.result-doc .doc-meta-row { display: grid; grid-template-columns: 140px 1fr; font-size: 13px; padding: 3px 0; color: var(--ink-soft); }
.result-doc .doc-meta-row b { color: var(--ink); }
.result-doc .doc-section { margin: 22px 0 0; }
.result-doc .doc-section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--rs-navy); border-bottom: 2px solid var(--line-soft); padding-bottom: 6px; margin: 0 0 10px; }
.result-doc .doc-q { font-size: 13px; font-weight: 700; color: var(--ink); margin: 14px 0 4px; }
.result-doc .doc-a { font-size: 14px; color: var(--ink-soft); line-height: 1.6; white-space: pre-wrap; }
.result-doc .doc-a i { color: var(--ink-mute); }
.result-doc .doc-score { display: inline-block; margin-left: 8px; font-size: 11px; font-weight: 700; color: var(--rs-navy); }
.result-doc .doc-footer { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--line-soft); font-size: 11px; color: var(--ink-mute); }

/* DATA BLOCK — the machine-readable payload, embedded so the dashboard can
   read it back out of the printed PDF. Invisible on screen; printed on its
   own page at the end of the PDF. */
.data-block { display: none; }
.data-block .data-note { font-size: 10px; color: #888; margin: 0 0 6px; }
.data-block pre {
  font-family: 'Courier New', Courier, monospace;
  font-size: 8.5px;
  line-height: 1.35;
  white-space: pre;
  word-break: normal;
  overflow-wrap: normal;
}

@media print {
  @page { margin: 1in; }
  body { background: #fff !important; }
  .topbar, .stage-bar, .autosave, .resume-banner, .print-hide { display: none !important; }
  .shell { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
  .result-doc { border: none !important; box-shadow: none !important; padding: 0 !important; margin: 0 !important; max-width: 100% !important; }
  .data-block { display: block !important; page-break-before: always; }
}
</style>
</head>

<script>
// Small display helper: position + team, added once, used wherever a coach's
// role is shown so the "seat" (site + position) stays visible even as the
// person in it changes. Omitted anywhere a team doesn't apply (Department).
function roleTeamLabel(p) {
  if (!p) return '';
  var role = p.role || '';
  var team = p.team || '';
  return (team && team !== 'Department') ? (role + ' · ' + team) : role;
}

//==============================================================================
// CONFIG
//==============================================================================
const BRAND = {
  org: 'Boston Red Sox',
  orgShort: 'Red Sox',
  orgLabel: 'RED SOX',
  dept: 'S&C · Player Development',
  deptShort: 'S&C',
  app: 'Coach Performance & Development Platform',
  primary:        '#BD3039',
  primaryDark:    '#8C2128',
  secondary:      '#0C2340',
  secondaryLight: '#1A3357',
  emailDomain: 'redsox.com',
  emailSender: 'ecoleman@redsox.com',
};

//==============================================================================
// BACKEND — auto-email + Sheet write on submit.
// Paste the deployed Apps Script Web App URL here, and the form_key printed
// by getFormKey() in the Apps Script editor. Leave BACKEND_URL empty to
// disable the backend path and fall back to the JSON download + mailto flow.
//==============================================================================
const BACKEND_URL = ''; // e.g. 'https://script.google.com/macros/s/AKfycb.../exec'
const FORM_KEY    = ''; // e.g. 'a1b2c3d4-...' (from getFormKey() in Apps Script)

//==============================================================================
// STAFF ROSTER — colleagues a reviewer can write feedback about.
// Should match the platform's seed staff list. Update if staffing changes.
//==============================================================================
const STAFF = [
  { id: 'marcus-webb',     name: 'Marcus Webb',      role: 'Director', team: 'Department' },
  { id: 'erin-coleman',   name: 'Erin Coleman',    role: 'Coordinator', team: 'Department' },
  { id: 'derek-simmons',  name: 'Derek Simmons',   role: 'Assistant Coordinator', team: 'Department' },
  { id: 'tyler-brooks',     name: 'Tyler Brooks',      role: 'Lead Coach', team: 'Salem' },
  { id: 'megan-foster',  name: 'Megan Foster',   role: 'Assistant Coach', team: 'Salem' },
  { id: 'austin-reed', name: 'Austin Reed',  role: 'Lead Coach', team: 'Greenville' },
  { id: 'kayla-sanders',    name: 'Kayla Sanders',     role: 'Assistant Coach', team: 'Greenville' },
  { id: 'jordan-blake',      name: 'Jordan Blake',       role: 'Lead Coach', team: 'Portland' },
  { id: 'hannah-adams',  name: 'Hannah Adams',   role: 'Assistant Coach', team: 'Portland' },

};

//==============================================================================
// PERSISTENCE
//==============================================================================
function saveDraft() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      stage: state.stage,
      reviewer: state.reviewer,
      recipient: state.recipient,
      relationship: state.relationship,
      strengths: state.strengths,
      growth: state.growth,
      observedCoaching: state.observedCoaching,
      scores: state.scores,
      blindSpots: state.blindSpots,
      acknowledgments: state.acknowledgments,
    }));
    showAutosave();
  } catch (e) {}
}
function loadDraft() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    Object.assign(state.reviewer, d.reviewer || {});
    Object.assign(state.recipient, d.recipient || {});
    state.relationship = d.relationship || '';
    Object.assign(state.strengths, d.strengths || {});
    Object.assign(state.growth, d.growth || {});
    Object.assign(state.observedCoaching, d.observedCoaching || {});
    Object.assign(state.scores, d.scores || {});
    state.blindSpots = d.blindSpots || '';
    state.acknowledgments = d.acknowledgments || '';
    return (state.reviewer.firstName || state.reviewer.email || state.recipient.coachId);
  } catch (e) { return false; }
}
function clearDraft() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}
let autosaveTimer = null;
function showAutosave() {
  const el = document.getElementById('autosave');
  if (!el) return;
  el.classList.add('show');
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => el.classList.remove('show'), 1200);
}

//==============================================================================

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function applyBrand() {
  document.title = `${BRAND.orgShort} ${BRAND.deptShort} — Colleague development input`;
  document.getElementById('brand-name').textContent = BRAND.orgShort;
  document.getElementById('brand-dept').textContent = BRAND.dept;
}
function firstName(name) { return (name || '').split(/\s+/)[0] || ''; }

//==============================================================================
// LIKERT SCALES — two templates, used across the six scored questions.
// Scores rate the reviewer's experience, not the colleague's ability.
// Coaches see aggregated avg + range across reviewers (computed in dashboard).
//==============================================================================
const SCALE_CONSISTENCY = {
  prompt: 'How consistently do you experience this?',
  anchors: '<b>1</b> rarely &middot; <b>3</b> sometimes &middot; <b>5</b> consistently',
};
const SCALE_IMPACT = {
  prompt: 'How much would more of this benefit the team or your work?',
  anchors: '<b>1</b> marginal &middot; <b>3</b> moderate &middot; <b>5</b> significant uplift',
};
const SCALE_OBSERVED_CONSISTENCY = {
  prompt: 'How consistently do you see this in their coaching?',
  anchors: '<b>1</b> rarely &middot; <b>3</b> sometimes &middot; <b>5</b> consistently',
};
const SCALE_OBSERVED_IMPACT = {
  prompt: 'How much would fine-tuning this benefit their player work?',
  anchors: '<b>1</b> marginal &middot; <b>3</b> moderate &middot; <b>5</b> significant uplift',
};

function renderScale(scoreKey, scaleTemplate) {
  const current = state.scores[scoreKey];
  return `
    <div class="scale-block">
      <div class="scale-prompt">
        ${escapeHtml(scaleTemplate.prompt)}
        <span class="scale-optional">(optional)</span>
      </div>
      <div class="scale-pills-row" role="radiogroup" aria-label="${escapeHtml(scaleTemplate.prompt)}">
        ${[1, 2, 3, 4, 5].map(v => `
          <button type="button" class="scale-num-pill ${current === v ? 'selected' : ''}" data-val="${v}" data-key="${escapeHtml(scoreKey)}" onclick="setScore('${escapeHtml(scoreKey)}', ${v})" aria-checked="${current === v}">${v}</button>
        `).join('')}
      </div>
      <div class="scale-anchors">${scaleTemplate.anchors}</div>
    </div>
  `;
}

function setScore(key, val) {
  // Toggle — clicking the selected pill clears it (lets a reviewer un-score)
  state.scores[key] = (state.scores[key] === val) ? null : val;
  // Update visual selection state without re-rendering the whole page
  document.querySelectorAll(`.scale-num-pill[data-key="${key}"]`).forEach(p => {
    p.classList.toggle('selected', Number(p.dataset.val) === state.scores[key]);
    p.setAttribute('aria-checked', Number(p.dataset.val) === state.scores[key]);
  });
  saveDraft();
}

//==============================================================================
// RESULT DOCUMENT + EMBEDDED DATA BLOCK
// The printable page is the actual deliverable in the manual (no-backend)
// path now: a clean, readable record of one reviewer's input, with the
// structured payload embedded at the end (visible only when printed) so the
// dashboard can read it back out of the PDF. Base64 is used, hard-wrapped at
// a fixed width with real line breaks, specifically so it survives being
// reflowed and re-extracted as text from a PDF: whitespace can be stripped
// back out safely before decoding, unlike a plain-text JSON dump where a
// dropped or inserted space can silently corrupt the JSON.
//==============================================================================
function utf8ToBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function wrapText(str, width) {
  const lines = [];
  for (let i = 0; i < str.length; i += width) lines.push(str.slice(i, i + width));
  return lines.join('\n');
}
function buildDataBlockHtml(payload) {
  const b64 = utf8ToBase64(JSON.stringify(payload));
  const wrapped = wrapText(b64, 60);
  return `
    <div class="data-block">
      <p class="data-note">For the Coordinator's dashboard import &mdash; structured data below. Please keep this page in the saved PDF; do not edit it.</p>
      <pre>---BEGIN-360-DATA---
${wrapped}
---END-360-DATA---</pre>
    </div>
  `;
}

function renderResultDoc(payload) {
  const fb = payload.feedback;
  const rec = payload.recipient;
  const first = firstName(rec.name);
  const scoreTag = (v) => v != null ? `<span class="doc-score">${v}/5</span>` : '';
  const qa = (question, text, score) => `
    <div class="doc-q">${escapeHtml(question)}${scoreTag(score)}</div>
    <div class="doc-a">${text && text.trim() ? escapeHtml(text) : '<i>Not answered.</i>'}</div>
  `;
  const relLabel = (RELATIONSHIPS.find(r => r.id === payload.relationship)?.label) || 'Not specified';
  return `
    <div class="result-doc" id="result-doc">
      <div class="doc-rule"></div>
      <div class="doc-eyebrow">${escapeHtml(BRAND.orgLabel)} &middot; Colleague development input</div>
      <h1>360 Development Input</h1>
      <div class="doc-sub">Supporting ${escapeHtml(rec.name)} (${escapeHtml(rec.role)}) &middot; submitted ${escapeHtml((payload.submittedAt || '').slice(0, 10))}</div>

      <div class="doc-meta-row"><b>Reviewer</b><span>${escapeHtml(payload.reviewer.name)} &middot; ${escapeHtml(payload.reviewer.email)}</span></div>
      <div class="doc-meta-row"><b>Colleague</b><span>${escapeHtml(rec.name)} &middot; ${escapeHtml(rec.role)}</span></div>
      <div class="doc-meta-row"><b>Work together</b><span>${escapeHtml(relLabel)}</span></div>
      <div class="doc-meta-row"><b>Response ID</b><span>${escapeHtml(payload.responseId)}</span></div>

      <div class="doc-section">
        <h3>Strengths</h3>
        ${qa('What does ' + first + ' do best for the team?', fb.strengths.forTeam, fb.scores.strengthsTeam)}
        ${qa('What do they do best that specifically helps you in your role?', fb.strengths.forMe, fb.scores.strengthsMe)}
      </div>

      <div class="doc-section">
        <h3>Growth</h3>
        ${qa('What could they do more of for the team?', fb.growth.forTeam, fb.scores.growthTeam)}
        ${qa('What could they do to assist you further in your role?', fb.growth.forMe, fb.scores.growthMe)}
      </div>

      <div class="doc-section">
        <h3>Observed coaching</h3>
        ${qa('Observed strengths in coaching and player interactions', fb.observedCoaching.strengths, fb.scores.ocStrengths)}
        ${qa('Observed areas to fine-tune in coaching and player interactions', fb.observedCoaching.growthAreas, fb.scores.ocGrowth)}
      </div>

      <div class="doc-section">
        <h3>Blind spots &amp; acknowledgments</h3>
        ${qa('Blind spots this colleague may not see', fb.blindSpots, null)}
        ${qa('Specific contributions worth acknowledging', fb.acknowledgments, null)}
      </div>

      <div class="doc-footer">
        Completed by the reviewer named above, for the Coordinator only. It will be assembled, anonymized, into ${escapeHtml(first)}'s development report.
      </div>
    </div>
    ${buildDataBlockHtml(payload)}
  `;
}

function printResult() {
  const prevTitle = document.title;
  if (state.printName) document.title = state.printName;
  window.print();
  setTimeout(() => { document.title = prevTitle; }, 1000);
}

function downloadBackupJson() {
  if (!state._lastPayload) return;
  downloadJson(state._lastPayload, state.downloadName || 'development-input.json');
}

function renderConfirm() {
  const id = state.reviewer;
  const recipient = state.recipient;

  // Backend-delivered path: everything was sent server-side. No manual steps.
  if (state.deliveredVia === 'backend') {
    return `
      <div class="card confirm-state">
        <div class="check">✓</div>
        <h1>Sent &mdash; thank you</h1>
        <p>Thanks, ${escapeHtml(firstName(id.name))}. Your input toward ${escapeHtml(firstName(recipient.name))}'s development has been securely delivered to the Coordinator. No further action needed.</p>

        <div style="margin-top: 16px; padding: 14px 16px; background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 8px; color: #1b5e20; font-size: 14px; text-align: left;">
          <b>What happens next</b>
          <ul style="margin: 8px 0 0; padding-left: 22px; line-height: 1.6;">
            <li>The Coordinator receives your input as an email with the JSON attached.</li>
            <li>A copy is stored in the department's secure Sheet.</li>
            <li>It will be assembled, anonymized and with no reviewer named, into ${escapeHtml(firstName(recipient.name))}'s dashboard report once 3+ colleagues have contributed, and the Coordinator will walk them through it in person.</li>
          </ul>
        </div>

        <p class="muted" style="margin-top: 20px; font-size: 12px;">
          Submitted ${escapeHtml(state.submittedAt)} &middot; Response ID <code>${escapeHtml(state.responseId)}</code>
        </p>

        <div style="margin-top: 22px;">
          <button class="btn btn-primary" onclick="newSubmission()">Support another colleague's development</button>
        </div>
      </div>
    `;
  }

  // Manual path: no backend configured (or it was unreachable). The reviewer
  // checks the formatted result below, prints it as a PDF with normal
  // margins, and emails that PDF to the Coordinator themselves.
  return `
    <div class="card print-hide">
      <div class="eyebrow">Confirmed</div>
      <h1>Print this as a PDF and send it to the Coordinator</h1>
      <p>Below is exactly what will print. It's already confirmed &mdash; if something needs fixing, use "Support another colleague's development" to start a fresh submission instead.</p>

      <div class="step-list">
        <div class="step-item">
          <div class="step-num">1</div>
          <div class="step-text">
            <span class="step-title">Check the document below</span>
            <span class="step-detail">This is exactly what the Coordinator will receive.</span>
          </div>
        </div>
        <div class="step-item">
          <div class="step-num">2</div>
          <div class="step-text">
            <span class="step-title">Click "Print to PDF"</span>
            <span class="step-detail">Choose "Save as PDF" (or your printer's PDF option) as the destination. Margins are already set to normal.</span>
          </div>
        </div>
        <div class="step-item critical">
          <div class="step-num">3</div>
          <div class="step-text">
            <span class="step-title">Email the saved PDF to the Coordinator</span>
            <span class="step-detail">Attach the PDF you just saved &mdash; it does not attach automatically. The Coordinator will assemble it, anonymized, into ${escapeHtml(firstName(recipient.name))}'s dashboard report and walk them through the feedback.</span>
          </div>
        </div>
      </div>

      <div class="nav-row" style="flex-wrap: wrap;">
        <button class="btn btn-link" onclick="downloadBackupJson()">Download backup JSON</button>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <button class="btn btn-ghost" onclick="emailToCoordinator()">Email the PDF to Coordinator</button>
          <button class="btn btn-primary btn-big" onclick="printResult()">Print to PDF</button>
        </div>
      </div>
    </div>

    ${renderResultDoc(state._lastPayload)}

    <div class="card print-hide" style="margin-top: 16px;">
      <p class="muted" style="margin: 0;">Response ID <code>${escapeHtml(state.responseId)}</code></p>
      <div style="margin-top: 14px;">
        <button class="btn btn-ghost" onclick="newSubmission()">Support another colleague's development</button>
      </div>
    </div>
  `;
}

function newSubmission() {
  // Reset everything except reviewer identity (so they don't have to re-enter)
  const keepReviewer = { ...state.reviewer };
  clearDraft();
  state.stage = 1; // jump straight to identify step
  state.reviewer = keepReviewer;
  state.recipient = { coachId: '', name: '', role: '' };
  state.relationship = '';
  state.strengths = { forTeam: '', forMe: '' };
  state.growth = { forTeam: '', forMe: '' };
  state.observedCoaching = { strengths: '', growthAreas: '' };
  state.scores = { strengthsTeam: null, strengthsMe: null, growthTeam: null, growthMe: null, ocStrengths: null, ocGrowth: null };
  state.blindSpots = '';
  state.acknowledgments = '';
  state.submittedAt = null;
  state.responseId = null;
  state.deliveredVia = null;
  state._lastPayload = null;
  state.downloadName = null;
  render();
}

//==============================================================================
// NAVIGATION
//==============================================================================
function goNext() {
  if (state.stage < STAGES.length - 1) {
    state.stage++;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    saveDraft();
  }
}
function goPrev() {
  if (state.stage > 0) {
    state.stage--;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    saveDraft();
  }
}

//==============================================================================
// SUBMIT
//==============================================================================
function buildPayload() {
  const responseId = `360-${state.recipient.coachId || 'unknown'}-${Date.now().toString(36)}`;
  return {
    schemaVersion: 1,
    kind: '360',
    responseId,
    submittedAt: new Date().toISOString(),
    reviewer: {
      firstName: state.reviewer.firstName,
      lastName: state.reviewer.lastName,
      name: state.reviewer.name,
      email: state.reviewer.email,
    },
    recipient: {
      coachId: state.recipient.coachId,
      name: state.recipient.name,
      role: state.recipient.role,
    },
    relationship: state.relationship || null,
    feedback: {
      strengths: {
        forTeam: state.strengths.forTeam || '',
        forMe:   state.strengths.forMe   || '',
      },
      growth: {
        forTeam: state.growth.forTeam || '',
        forMe:   state.growth.forMe   || '',
      },
      observedCoaching: {
        strengths:   state.observedCoaching.strengths   || '',
        growthAreas: state.observedCoaching.growthAreas || '',
      },
      scores: {
        strengthsTeam: state.scores.strengthsTeam,
        strengthsMe:   state.scores.strengthsMe,
        growthTeam:    state.scores.growthTeam,
        growthMe:      state.scores.growthMe,
        ocStrengths:   state.scores.ocStrengths,
        ocGrowth:      state.scores.ocGrowth,
      },
      blindSpots: state.blindSpots || '',
      acknowledgments: state.acknowledgments || '',
    },
    brand: BRAND.org,
  };
}

async function downloadJson(payload, name) {
  const jsonStr = JSON.stringify(payload, null, 2);
  // Inside the Claude artifact preview, a plain <a download> link is inert —
  // the sandbox never grants pages direct file-save permission. Use the
  // `downloads` capability there instead. Once this page is deployed on its
  // own (GitHub Pages, Netlify, an internal server), window.claude will not
  // exist at all and this falls straight through to the classic browser
  // download below, unchanged from how it always worked.
  if (typeof window !== 'undefined' && window.claude && typeof window.claude.use === 'function') {
    try {
      const downloads = await window.claude.use('downloads');
      if (downloads) {
        await downloads.save({ filename: name, data: jsonStr });
        return;
      }
    } catch (e) {
      console.warn('downloads capability save unavailable/declined, falling back to browser download', e);
    }
  }
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 250);
}

async function onConfirm() {
  const btn = document.getElementById('submit-btn');
  const status = document.getElementById('submit-status');
  btn.disabled = true;
  btn.textContent = 'Confirming…';
  if (status) status.textContent = '';

  const payload = buildPayload();
  state._lastPayload = payload;
  const safeRec = (payload.recipient.coachId || 'unknown').replace(/[^a-z0-9]+/gi, '-');
  const safeRev = (state.reviewer.email || 'unknown').split('@')[0].replace(/[^a-z0-9]+/gi, '-');
  const baseName = `360_${safeRec}_from-${safeRev}_${new Date().toISOString().slice(0,10)}`;
  state.downloadName = baseName + '.json';
  state.printName = baseName;

  let delivered = null;

  // Try the backend first — auto-emails the Coordinator with the JSON attached,
  // and writes a durable row to the Sheet. Falls back to the local JSON download
  // + mailto flow if the backend is unreachable or misconfigured, so no
  // submission is ever fully lost.
  if (BACKEND_URL && BACKEND_URL.startsWith('http') && FORM_KEY) {
    try {
      if (status) status.textContent = 'Sending securely to the Coordinator…';
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        mode: 'cors',
        // text/plain avoids a CORS preflight; Apps Script accepts the body as-is.
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'submit_feedback_form',
          form_key: FORM_KEY,
          form_type: '360',
          submission: payload
        }),
        redirect: 'follow'
      });
      if (res.ok) {
        const txt = await res.text();
        let j = null;
        try { j = JSON.parse(txt); } catch (_) {}
        if (j && j.ok) delivered = 'backend';
      }
    } catch (e) {
      console.warn('Backend send failed, falling back to JSON download', e);
    }
  }

  if (!delivered) {
    // Manual path: no download here — the confirm/result stage shows the
    // printable document and the reviewer prints and emails it themselves.
    delivered = 'print';
  }

  state.submittedAt = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
  state.responseId = payload.responseId;
  state.deliveredVia = delivered;

  // Clear the draft now that it's been submitted successfully.
  clearDraft();

  state.stage = STAGES.length - 1;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function emailToCoordinator() {
  const payload = state._lastPayload;
  const r = state.reviewer;
  const rec = state.recipient;
  const subject = `Development input (PDF) — supporting ${rec.name}`;
  const lines = [
    `Hi Simon,`, ``,
    `[ Please attach the PDF you just saved before sending — it does not attach automatically. ]`, ``,
    `Reviewer:     ${r.name} <${r.email}>`,
    `Supporting:   ${rec.name} (${rec.role})`,
    `Relationship: ${state.relationship || 'not specified'}`,
    `Response ID:  ${payload ? payload.responseId : (state.responseId || '')}`, ``,
    `Thanks,`, `${r.name}`,
  ];
  const body = lines.join('\n');
  const mailto = `mailto:${encodeURIComponent(BRAND.emailSender)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.location.href = mailto;
}

//==============================================================================
// MAIN RENDER
//==============================================================================
function renderStageBar() {
  // Welcome and confirm are not counted as steps
  const numSteps = STAGES.length - 2;
  const currentStep = state.stage === 0 ? 0 : (state.stage === STAGES.length - 1 ? numSteps + 1 : state.stage);
  const pips = [];
  for (let i = 1; i <= numSteps; i++) {
    let cls = '';
    if (i < currentStep) cls = 'done';
    else if (i === currentStep) cls = 'active';
    pips.push(`<div class="pip ${cls}"></div>`);
  }
  document.getElementById('stage-bar').innerHTML = pips.join('');
}

function render() {
  const stageKey = STAGES[state.stage];
  let html = '';
  if (stageKey === 'welcome')          html = renderWelcome();
  else if (stageKey === 'identify')    html = renderIdentify();
  else if (stageKey === 'strengths')   html = renderStrengths();
  else if (stageKey === 'growth')      html = renderGrowth();
  else if (stageKey === 'observed-coaching') html = renderObservedCoaching();
  else if (stageKey === 'blindspots-acks') html = renderBlindspotsAcks();
  else if (stageKey === 'review')      html = renderReview();
  else if (stageKey === 'confirm')     html = renderConfirm();
  document.getElementById('root').innerHTML = html;
  renderStageBar();
}

//==============================================================================
// INIT
//==============================================================================
if (typeof window !== 'undefined') window.state = state;

applyBrand();

const hadDraft = loadDraft();
if (hadDraft) {
  const banner = document.createElement('div');
  banner.className = 'resume-banner';
  banner.innerHTML = `
    <span><b>Welcome back.</b> We found a draft in progress &mdash; pick up where you left off?</span>
    <div>
      <button onclick="this.parentElement.parentElement.remove(); render();">Resume</button>
      <button onclick="if(confirm('Discard the saved draft and start over?')) { clearDraft(); location.reload(); }" style="background: transparent; color: #6b4f0c; border: 1px solid #6b4f0c; margin-left: 6px;">Start over</button>
    </div>
  `;
  document.querySelector('.shell').insertBefore(banner, document.getElementById('stage-bar'));
}
render();
</script>
