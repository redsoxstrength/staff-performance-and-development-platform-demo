function renderCoordHome() {
  const u = currentUser();
  if (!u) return navigate('/login');
  if (!isLeadership(u)) return navigate('/coach/home');
  const isDirector = u.accessTier === 'director';
  // "all" = the coach-level group used in distribution + flag aggregation + status columns
  const all = STATE.coaches.filter(c => isCoachLevel(c));
  const coordUsers = STATE.coaches.filter(c => c.accessTier === 'coordinator');

  // Aggregate flags
  let allFlags = [];
  all.forEach(c => {
    activeFlags(c).forEach(f => allFlags.push({ ...f, coach: c }));
  });
  const byKind = { celebrate: [], acknowledge: [], support: [], intervene: [] };
  allFlags.forEach(f => byKind[f.kind] && byKind[f.kind].push(f));
  // limit to N per kind
  const limit = 4;

  const completion = all.length;
  const submitted = all.filter(c => c.cycles.length > 0).length;
  const completionPct = Math.round(100 * submitted / completion);
  const personalAvg = avg(all.map(c => rollUp(c).personalAvg));
  const proAvg = avg(all.map(c => rollUp(c).proAvg));

  // Distribution data — each row aggregates a category/pillar's axis IDs
  function axisIdsFor(group) {
    if (group.kind === 'personal') {
      const cat = PERSONAL_TAXONOMY.find(x => x.id === group.taxId);
      return cat ? cat.subs.map(s => s.id) : [];
    }
    const pil = PROFESSIONAL_TAXONOMY.find(x => x.id === group.taxId);
    return pil ? pil.focuses.map(f => f.id) : [];
  }
  function aggForCycle(cy, ids) {
    return avg(ids.map(id => cy.scores[id].outcome));
  }
  const distAxes = [
    { taxId: 'wellbeing', label: 'Wellbeing', kind: 'personal' },
    { taxId: 'resilience', label: 'Resilience', kind: 'personal' },
    { taxId: 'cognitive', label: 'Cognitive & interpersonal', kind: 'personal' },
    { taxId: 'life-mgmt', label: 'Life management', kind: 'personal' },
    { taxId: 'sc-knowledge', label: 'S&C knowledge', kind: 'professional' },
    { taxId: 'coaching', label: 'Coaching effectiveness', kind: 'professional' },
    { taxId: 'universal', label: 'Universal competencies', kind: 'professional' }
  ];

  const distRows = distAxes.map(a => {
    const ids = axisIdsFor(a);
    // Each dot is tied to a specific coach so we can show their initials on hover.
    const dotData = all.map(c => ({
      value: aggForCycle(c.cycles[c.cycles.length - 1], ids),
      initials: c.initials,
      name: c.name,
      id: c.id
    }));
    const m = avg(dotData.map(d => d.value));
    const prev = avg(all.map(c => {
      const cy = c.cycles[c.cycles.length - 2] || c.cycles[c.cycles.length - 1];
      return aggForCycle(cy, ids);
    }));
    const dotsHtml = dotData.map(d => {
      const pct = ((d.value - 20) / 60) * 100;
      return `<button class="dot dot-button" style="left:${pct}%;background:${a.kind==='personal'?'#0C2340':'#BD3039'}" data-initials="${d.initials}" title="${d.name} · ${Math.round(d.value)}" aria-label="${d.name}: ${Math.round(d.value)}" onclick="drillThrough('${d.id}')"></button>`;
    }).join('');
    const meanPct = ((m - 20) / 60) * 100;
    const prevPct = ((prev - 20) / 60) * 100;
    const ticks = [20, 40, 60, 80].map(t => {
      const pct = ((t - 20) / 60) * 100;
      return `<div class="tick" style="left:${pct}%"></div><div class="tick-label" style="left:${pct}%">${t}</div>`;
    }).join('');
    return `<div class="dist-row">
      <div class="label-col">
        <span class="lname">${a.label}</span>
        <span class="chip ${a.kind === 'personal' ? 'chip-info' : 'chip-bad'}">${a.kind}</span>
      </div>
      <div class="dist-track">
        <div class="axis"></div>
        ${ticks}
        ${dotsHtml}
        <div class="prev" style="left:${prevPct}%"></div>
        <div class="mean" style="left:${meanPct}%"></div>
      </div>
      <div class="right-col">
        <span class="bold">${m}</span>
        <span class="delta" style="color:${m>prev?'var(--good)':m<prev?'var(--bad)':'var(--text-3)'}">${m>prev?'+':''}${m-prev} vs prev</span>
      </div>
    </div>`;
  }).join('');

  const flagSection = (kind) => {
    const list = byKind[kind].slice(0, limit);
    if (!list.length) return '';
    const meta = {
      intervene: { label: 'INTERVENE', cls: 'intervene', icon: 'i-alert', count: byKind[kind].length },
      support: { label: 'SUPPORT', cls: 'support', icon: 'i-life-buoy', count: byKind[kind].length },
      celebrate: { label: 'CELEBRATE', cls: 'celebrate', icon: 'i-star', count: byKind[kind].length },
      acknowledge: { label: 'ACKNOWLEDGE', cls: 'acknowledge', icon: 'i-eye', count: byKind[kind].length }

    const m = meta[kind];
    return `<div class="flag-group ${m.cls}">
      <svg class="icon icon-sm"><use href="#${m.icon}"/></svg>
      ${m.label} &middot; ${m.count}
    </div>` + list.map(f => `<div class="flag-row">
      <div>
        <div class="name">${f.coach.name} &middot; ${axisLabel(f.axisId, f.axisKind)}</div>

      </div>
      <button class="btn btn-sm" onclick="drillThrough('${f.coach.id}')">Open <svg class="icon icon-sm"><use href="#i-chevron-right"/></svg></button>

  };

  // Cadence tracker
  const submittedThisCycle = all.filter(c => c.cycles.length >= 5).length;
  const partial = all.filter(c => c.cycles.length === 4).length;
  const missed = all.filter(c => c.cycles.length < 4).length;

  // Group coaches by status (Thriving / Steady / Surviving) using flag-mix mapping
  const groups = { thriving: [], steady: [], surviving: [] };
  all.forEach(c => groups[coachStatus(c)].push(c));

  const coachTileHtml = (c) => coachTileFullHtml(c, `drillThrough('${c.id}')`);

  const renderStatusColumn = (key, title, sub) => {
    const list = groups[key];
    return `<div class="status-col">
      <div class="status-col-head ${key}">
        <div class="row between">
          <div class="bold">${title}</div>
          <span class="chip chip-${key === 'thriving' ? 'good' : key === 'surviving' ? 'bad' : 'info'}">${list.length}</span>
        </div>
        <div class="text-xs">${sub}</div>
      </div>
      <div class="status-col-body">
        ${list.length ? list.map(coachTileHtml).join('') : '<div class="text-xs text-3" style="padding:12px;text-align:center">no one here this cycle</div>'}
      </div>
    </div>`;
  };

  const statusColumnsHtml = `<div class="status-cols">
    ${renderStatusColumn('thriving', 'Thriving', 'Celebrate flags &middot; high-effort, high-outcome')}
    ${renderStatusColumn('steady', 'Steady', 'Acknowledge or support flags &middot; in between')}
    ${renderStatusColumn('surviving', 'Surviving', 'Intervene flags &middot; needs the conversation')}
  </div>`;

  // Leadership tile (only the Director sees this — they look at the Coordinator first)
  const leadershipPanelHtml = isDirector && coordUsers.length ? (() => {
    const c = coordUsers[0];

    const flags = activeFlags(c);

    return `<div class="card mt-12">
      <div class="section-head">
        <h2>Leadership</h2>
        <div class="meta">Coordinator dashboard &middot; leadership-focused framework</div>
      </div>
      <button class="coach-tile leadership-tile" onclick="drillThrough('${c.id}')" style="text-align:left;width:100%">
        <div class="row gap-12" style="align-items:center">
          <div class="coach-tile-avatar status-${coachStatus(c)}" style="width:42px;height:42px;font-size:14px;flex:none">${c.initials}</div>
          <div style="flex:1">
            <div class="row between" style="align-items:baseline">
              <div>
                <div class="name" style="font-size:15px">${c.name}</div>
                <div class="role" style="font-size:12px">${roleTeamLabel(c)}</div>
              </div>
              <div class="row" style="gap:6px">${chips}</div>
            </div>
            <div class="row gap-12 mt-8 text-xs text-2" style="flex-wrap:wrap">
              <span>personal avg <span class="bold" style="color:var(--text)">${ru.personalAvg}</span></span>
              <span>leadership avg <span class="bold" style="color:var(--text)">${ru.proAvg}</span></span>
              <span>${c.cycles.length} cycles</span>
            </div>
          </div>
          <svg class="icon"><use href="#i-arrow-right"/></svg>
        </div>
      </button>
    </div>`;
  })() : '';

  view().innerHTML = `
    <div class="page-header">
      <div>
        <div class="label">${brandLabel(`${BRAND.deptShort} · ${isDirector ? 'DIRECTOR VIEW' : 'COORDINATOR VIEW'}`)}</div>
        <h1>${isDirector ? 'Department overview' : 'Staff overview'} &middot; cycle ${all[0] ? all[0].cycles.length : 0}</h1>
        <div class="sub">${all.length} coach${all.length === 1 ? '' : 'es'}${isDirector ? ' + 1 coordinator' : ''} &middot; ${allFlags.length} active flags &middot; reports sent 7:02 am</div>
      </div>
      <div class="badges">
        <span class="badge"><svg class="icon icon-sm"><use href="#i-users"/></svg> ${submitted} of ${completion}</span>
        <span class="badge"><svg class="icon icon-sm"><use href="#i-flag"/></svg> ${allFlags.length} flags</span>
        <button class="page-header-cta" onclick="viewSelf();navigate('/coach/dashboard')" aria-label="Open my dashboard">
          My Dashboard <svg class="icon icon-sm"><use href="#i-arrow-right"/></svg>
        </button>
      </div>
    </div>

    ${leadershipPanelHtml}

    <div class="grid-4">
      <div class="metric"><div class="label">Cycle completion</div><div class="num">${completionPct}%</div></div>
      <div class="metric"><div class="label">Staff personal avg</div><div class="num">${personalAvg}</div></div>
      <div class="metric"><div class="label">Staff pro avg</div><div class="num">${proAvg}</div></div>
      <div class="metric"><div class="label">Conversations queued</div><div class="num">${allFlags.length}</div><div class="delta text-2">${byKind.intervene.length} intervene</div></div>
    </div>

    <div class="card mt-12">
      <div class="section-head">
        <h2>Staff distribution by axis</h2>
        <div class="meta">Each dot is one coach &middot; 20 to 80</div>
      </div>
      ${distRows}
      <div class="legend-row mt-8" style="padding-left:0">
        <span><span class="legend-dot" style="background:#0C2340;opacity:0.55;border-radius:50%"></span>personal axis</span>
        <span><span class="legend-dot" style="background:#BD3039;opacity:0.55;border-radius:50%"></span>professional axis</span>
        <span><span class="legend-dot" style="background:var(--text);width:2px;height:12px;border-radius:0"></span>cycle mean</span>
        <span><span class="legend-dot" style="background:var(--text-3);width:1px;height:12px;border-radius:0"></span>last cycle</span>
      </div>
    </div>

    <div class="card mt-12">
      <div class="section-head">
        <h2>Cadence tracker</h2>
        <div class="meta">${all.length} coaches</div>
      </div>
      <div class="grid-4" style="margin-bottom:14px">
        <div class="metric" style="background:var(--good-bg)">
          <div class="label" style="color:var(--good)">SUBMITTED ON TIME</div>

          <div class="text-sm" style="margin-top:4px">Opens <span class="bold">Mon May 11, 6 am ET</span></div>

          <div class="flag-quadrant-cell quad-acknowledge">${flagSection('acknowledge')}</div>

          <div class="flag-quadrant-cell quad-intervene">${flagSection('intervene')}</div>

        </div>
        <div class="flag-quadrant-axis-x">EFFORT →</div>
      </div>
    </div>

    <div class="card mt-12">
      <div class="section-head">
        <h2>Staff at a glance</h2>
        <div class="meta">Grouped by current flag mix &middot; click anyone to drill in</div>
      </div>
      ${statusColumnsHtml}
    </div>

    ${renderObjectiveCoordPanel(all)}
  `;
}

window.drillThrough = function (coachId) {
  const viewer = currentUser();
  const target = STATE.coaches.find(c => c.id === coachId);
  if (!viewer || !target || !canViewCoach(viewer, target)) return;
  STATE.viewAs = coachId;
  saveState();
  navigate('/coach/dashboard');
};

function renderCoordCoach(p) {
  if (p.id) {
    STATE.viewAs = p.id;
    saveState();
  }
  renderCoachDashboard();
}

  // delivery professional — trim qualifiers that don't change meaning
  'Warm-ups & prep': 'Warm-ups',
  'Assessment skills': 'Assessment',
  'Program design': 'Program design',
  'Coaching & instruction': 'Coaching',
  'Tech & data': 'Tech & data',

  // leadership — condense longest "& X & Y" labels to their headline noun
  'Program standards & quality control': 'Program standards',
  'Periodization & planning oversight': 'Periodization',
  'Coaching & instruction standards': 'Coaching standards',
  'Sport science & baseball integration': 'Sport science',
  'Staff development & mentorship': 'Staff development',
  'Schedule & operations management': 'Operations',

  'Technology governance & staff adoption': 'Tech governance',

  'Evidence-based culture & innovation': 'Evidence-based culture'
};
function shortenLabel(s) { return SHORT_LABEL[s] || s; }

function escapeXml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Split a long label into 2 balanced lines at the best break (& or , or space).
function wrapLabel(label, maxChars) {
  if (label.length <= maxChars) return [label];
  let bestSplit = -1, bestMaxLen = label.length;
  for (let i = 1; i < label.length - 1; i++) {
    if (label[i] === '&' || label[i] === ',' || label[i] === ' ') {
      const a = label.slice(0, i).trim();
      const b = label.slice(i).trim();
      const m = Math.max(a.length, b.length);
      if (m < bestMaxLen) { bestMaxLen = m; bestSplit = i; }
    }
  }
  if (bestSplit === -1) return [label];
  return [label.slice(0, bestSplit).trim(), label.slice(bestSplit).trim()];
}

function spiderSvg({ axes, current, previous, color, accent, size = 500, height = 400, showLabels = true }) {
  const W = size, H = height, cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.22;
  const N = axes.length;
  const angle = i => (i / N) * Math.PI * 2 - Math.PI / 2;
  const point = (i, v) => {
    const r = ((v - 20) / 60) * R;
    return [cx + r * Math.cos(angle(i)), cy + r * Math.sin(angle(i))];
  };
  let html = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spider plot" preserveAspectRatio="xMidYMid meet">`;
  [20, 40, 60, 80].forEach(level => {
    const r = ((level - 20) / 60) * R;
    let pts = '';
    for (let i = 0; i < N; i++) {
      const a = angle(i);
      pts += `${cx + r * Math.cos(a)},${cy + r * Math.sin(a)} `;
    }
    html += `<polygon points="${pts}" fill="none" stroke="var(--border)" stroke-width="0.5"/>`;
  });
  for (let i = 0; i < N; i++) {
    const [x, y] = point(i, 80);
    html += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--border)" stroke-width="0.5"/>`;
  }
  if (previous) {
    let prevPts = '';
    previous.forEach((v, i) => {
      const [x, y] = point(i, v);
      prevPts += `${x.toFixed(1)},${y.toFixed(1)} `;
    });
    html += `<polygon points="${prevPts}" fill="none" stroke="${accent}" stroke-width="1" stroke-dasharray="3 2"/>`;
  }
  let curPts = '';
  current.forEach((v, i) => {
    const [x, y] = point(i, v);
    curPts += `${x.toFixed(1)},${y.toFixed(1)} `;
  });
  html += `<polygon points="${curPts}" fill="${color}" fill-opacity="0.18" stroke="${color}" stroke-width="1.5"/>`;
  current.forEach((v, i) => {
    const [x, y] = point(i, v);
    html += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2" fill="${color}"/>`;
  });
  if (showLabels) {
    // Radially-rotated labels with smart line-wrapping so every full word is visible
    // and adjacent axes don't collide tangentially.
    axes.forEach((a, i) => {
      if (!a.label) return;
      const ang = angle(i);
      const cosA = Math.cos(ang);
      // labelR pushes labels clear of the outer polygon ring + room for glyph descenders
      // and tangential text-height when labels are near-vertical (rotated).
      const labelR = R + 14;
      const x = cx + labelR * Math.cos(ang);
      const y = cy + labelR * Math.sin(ang);
      // Rotate text along the axis ray. Flip on the left half so it stays right-side-up.
      // For near-vertical axes (top + bottom), anchor 'start' makes text extend OUTWARD
      // from labelR rather than centering on it (which used to push half the text inward).
      let rotateDeg = ang * 180 / Math.PI;
      let anchor = 'start';
      if (cosA < -0.05) { rotateDeg += 180; anchor = 'end'; }
      // Near-vertical (|cos| ~ 0): keep anchor 'start' so text extends outward, not centered.
      const lines = wrapLabel(shortenLabel(a.label), 22);
      const xs = x.toFixed(1), ys = y.toFixed(1), rs = rotateDeg.toFixed(1);
      let inner;
      if (lines.length === 1) {
        inner = escapeXml(lines[0]);
      } else {
        inner =
          `<tspan x="${xs}" dy="-0.55em">${escapeXml(lines[0])}</tspan>` +
          `<tspan x="${xs}" dy="1.1em">${escapeXml(lines[1])}</tspan>`;
      }
      // Tap any label for the same axis explainer as the Glossary.
      const tapAttr = a.id && a.kind
        ? ` data-axis="${a.id}" onclick="showAxisInfo('${a.id}','${a.kind}')"`
        : '';
      html += `<text x="${xs}" y="${ys}" font-size="9" text-anchor="${anchor}" dominant-baseline="middle" fill="var(--text-2)" transform="rotate(${rs} ${xs} ${ys})"${tapAttr}>${inner}</text>`;
    });
  }
  html += '</svg>';
  return html;
}

function historySvg({ labels, series }) {
  const W = 480, H = 180, padL = 32, padR = 12, padT = 12, padB = 30;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const xFor = i => padL + (innerW * i) / (labels.length - 1);
  const yFor = v => padT + innerH - ((v - 20) / 60) * innerH;
  let html = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="History strip">`;
  [20, 40, 60, 80].forEach(v => {
    const y = yFor(v);
    html += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--border)" stroke-width="0.5"/>`;
    html += `<text x="${padL - 4}" y="${y + 3}" font-size="9" text-anchor="end" fill="var(--text-3)">${v}</text>`;
  });
  series.forEach(s => {
    const path = s.data.map((v, i) => `${i === 0 ? 'M' : 'L'}${xFor(i).toFixed(1)},${yFor(v).toFixed(1)}`).join(' ');
    html += `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    s.data.forEach((v, i) => {
      html += `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(v).toFixed(1)}" r="3" fill="${s.color}"/>`;
    });
  });
  labels.forEach((l, i) => {
    html += `<text x="${xFor(i).toFixed(1)}" y="${H - padB + 14}" font-size="10" text-anchor="middle" fill="var(--text-2)">${l}</text>`;
  });
  html += '</svg>';
  return html;
}
