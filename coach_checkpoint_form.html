<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach Checkpoint — Early Season</title>
<style>
:root {
  --rs-red:        #BD3039;
  --rs-red-dark:   #8C2128;
  --rs-navy:       #0C2340;
  --rs-navy-light: #1A3357;
  --ink:           #1a1a1a;
  --ink-soft:      #555;
  --ink-mute:      #888;
  --line:          #e5e7eb;
  --line-soft:     #f1f3f5;
  --bg:            #fafbfc;
  --card:          #ffffff;
  --pill-bg:       #f4f5f7;
  --pill-hover:    #ebedf0;
  --shadow:        0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
  --shadow-lift:   0 4px 12px rgba(12,35,64,0.10), 0 12px 28px rgba(12,35,64,0.08);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ----- Top header ----- */
.topbar {
  background: var(--rs-navy);
  color: #fff;
  padding: 14px 28px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 3px solid var(--rs-red);
}
.topbar .crest {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--rs-red);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.5px;
  flex-shrink: 0;
}
.topbar .brand {
  font-size: 14px;
  letter-spacing: 0.3px;
  opacity: 0.95;
}
.topbar .brand b { letter-spacing: 0.5px; }
.topbar .brand .sep { opacity: 0.5; margin: 0 6px; }

/* ----- Layout ----- */
.shell {
  max-width: 760px;
  margin: 0 auto;
  padding: 28px 24px 80px;
}
@media (max-width: 600px) {
  .shell { padding: 18px 16px 60px; }
  .topbar { padding: 12px 16px; }
}

/* ----- Stage indicator ----- */
.stage-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 24px;
}
.stage-bar .pip {
  flex: 1;
  height: 4px;
  background: var(--line);
  border-radius: 2px;
  transition: background 0.2s;
}
.stage-bar .pip.done   { background: var(--rs-navy); }
.stage-bar .pip.active { background: var(--rs-red); }

/* ----- Cards ----- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 28px;
  box-shadow: var(--shadow);
}
@media (max-width: 600px) { .card { padding: 20px; } }

.eyebrow {
  font-size: 11px;
  letter-spacing: 1.5px;
  font-weight: 700;
  color: var(--rs-red);
  margin-bottom: 8px;
  text-transform: uppercase;
}
h1 {
  font-size: 26px;
  margin: 0 0 12px;
  color: var(--rs-navy);
  letter-spacing: -0.2px;
}
h2 {
  font-size: 20px;
  margin: 0 0 8px;
  color: var(--rs-navy);
  letter-spacing: -0.2px;
}
h3 {
  font-size: 15px;
  margin: 0 0 6px;
  color: var(--ink);
  font-weight: 600;
}
p { margin: 0 0 14px; color: var(--ink-soft); }
.muted { color: var(--ink-mute); font-size: 13px; }

/* ----- Form fields ----- */
.field { margin-bottom: 22px; }
.field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 6px;
}
.field .hint {
  font-size: 12px;
  color: var(--ink-mute);
  margin-bottom: 8px;
}
.field input[type=text], .field select, .field textarea {
  width: 100%;
  font-family: inherit;
  font-size: 14px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
}
.field input[type=text]:focus, .field select:focus, .field textarea:focus {
  outline: none;
  border-color: var(--rs-navy);
  box-shadow: 0 0 0 3px rgba(12,35,64,0.10);
}
.field textarea {
  min-height: 90px;
  resize: vertical;
  line-height: 1.55;
}

/* ----- Scale pills (20-80 and 1-5) ----- */
.scale-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.scale-pills {
  display: flex;
  gap: 4px;
  background: var(--pill-bg);
  padding: 4px;
  border-radius: 10px;
  flex-wrap: wrap;
}
.scale-pill {
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-soft);
  background: transparent;
  border: none;
  padding: 8px 12px;
  border-radius: 7px;
  cursor: pointer;
  min-width: 38px;
  transition: background 0.12s, color 0.12s;
}
.scale-pill:hover { background: var(--pill-hover); }
.scale-pill.selected {
  background: var(--rs-navy);
  color: #fff;
  box-shadow: 0 1px 2px rgba(0,0,0,0.08);
}
.scale-pill.dim { color: var(--ink-mute); }
.scale-meta {
  font-size: 12px;
  color: var(--ink-mute);
  min-width: 70px;
}

/* ----- Focus rows ----- */
.focus-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 16px;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid var(--line-soft);
}
.focus-row:last-of-type { border-bottom: none; }
.focus-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
}
.focus-name .focus-hint {
  display: block;
  font-size: 12px;
  color: var(--ink-mute);
  font-weight: 400;
  margin-top: 2px;
}
@media (max-width: 600px) {
  .focus-row { grid-template-columns: 1fr; gap: 8px; }
}

/* ----- Pillar live average chip ----- */
.pillar-avg-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 18px;
  padding: 10px 14px;
  background: var(--rs-navy);
  color: #fff;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
}
.pillar-avg-chip b {
  font-size: 16px;
  font-weight: 700;
}
.pillar-avg-chip .label {
  font-size: 11px;
  letter-spacing: 1px;
  opacity: 0.7;
  text-transform: uppercase;
}

/* ----- Personal section card ----- */
.personal-block {
  padding: 18px 0;
  border-bottom: 1px solid var(--line-soft);
}
.personal-block:last-of-type { border-bottom: none; padding-bottom: 0; }
.personal-block h3 { margin-bottom: 10px; }
.personal-block .examples {
  font-size: 12px;
  color: var(--ink-mute);
  margin-bottom: 10px;
  line-height: 1.5;
}

/* ----- Nav buttons ----- */
.nav-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 28px;
}
.btn {
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  padding: 11px 22px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.12s, transform 0.05s;
  border: none;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: var(--rs-red);
  color: #fff;
}
.btn-primary:hover { background: var(--rs-red-dark); }
.btn-primary:disabled { background: #c4a8aa; cursor: not-allowed; }
.btn-ghost {
  background: transparent;
  color: var(--ink-soft);
  border: 1px solid var(--line);
}
.btn-ghost:hover { background: var(--pill-bg); }
.btn-link {
  background: transparent;
  color: var(--rs-navy);
  border: none;
  text-decoration: underline;
  font-size: 13px;
  padding: 6px 0;
  cursor: pointer;
}

/* ----- Scale legend ----- */
.legend {
  background: var(--line-soft);
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 20px;
  font-size: 13px;
  color: var(--ink-soft);
}
.legend b { color: var(--ink); }
.legend-row {
  display: grid;
  grid-template-columns: 50px 1fr;
  gap: 8px;
  padding: 3px 0;
}
.legend-row b { font-weight: 700; color: var(--rs-navy); }

/* ----- Confirmation screen ----- */
.confirm-state {
  text-align: center;
  padding: 28px 0;
}
.confirm-state .check {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: #2e7d32;
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  margin: 0 auto 16px;
}
.confirm-state .warn-icon {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: #ed8c00;
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; line-height: 1;
  margin: 0 auto 16px;
}
.confirm-state .err-icon {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--rs-red);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; line-height: 1;
  margin: 0 auto 16px;
}

/* ----- Summary review ----- */
.summary-section { margin-bottom: 16px; }
.summary-section h4 {
  font-size: 13px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--rs-red);
  margin: 0 0 8px;
}
.summary-row {
  display: grid;
  grid-template-columns: 1fr 60px;
  padding: 6px 0;
  font-size: 13px;
  color: var(--ink-soft);
  border-bottom: 1px solid var(--line-soft);
}
.summary-row b { color: var(--ink); font-weight: 600; }
.summary-row .score { text-align: right; font-weight: 700; color: var(--rs-navy); }
.summary-row.indent { padding-left: 12px; color: var(--ink-mute); }

/* ----- Autosave indicator ----- */
.autosave {
  position: fixed;
  bottom: 16px;
  right: 16px;
  background: var(--rs-navy);
  color: #fff;
  font-size: 12px;
  padding: 8px 14px;
  border-radius: 20px;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  box-shadow: var(--shadow-lift);
}
.autosave.show { opacity: 0.95; }

/* ----- Resume banner ----- */
.resume-banner {
  background: #fff8e1;
  border: 1px solid #f5c34b;
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 20px;
  font-size: 13px;
  color: #6b4f0c;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.resume-banner button {
  background: #6b4f0c;
  color: #fff;
  border: none;
  padding: 6px 12px;
  border-radius: 5px;
  font-size: 12px;
  cursor: pointer;
  font-weight: 600;
}

.error-msg {
  color: var(--rs-red);
  font-size: 13px;
  margin-top: 8px;
  font-weight: 600;
}

.json-display {
  background: #f8f9fa;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px;
  font-family: "SF Mono", Monaco, Consolas, monospace;
  font-size: 11px;
  color: var(--ink-soft);
  max-height: 240px;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-all;
}

.btn-big { font-size: 16px; padding: 14px 28px; }

/* ----- Step list — numbered, prominent, text-left ----- */
.step-list { text-align: left; margin: 20px 0; }
.step-item {
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 14px;
  align-items: flex-start;
  padding: 14px 0;
  border-bottom: 1px solid var(--line-soft);
}
.step-item:last-child { border-bottom: none; }
.step-num {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--rs-red);
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.step-item.critical .step-num { background: #ed8c00; }
.step-text { font-size: 14px; line-height: 1.6; color: var(--ink); }
.step-text .step-title { font-weight: 700; color: var(--rs-navy); margin-bottom: 4px; display: block; }
.step-text .step-detail { color: var(--ink-soft); font-size: 13px; }
.step-text code {
  background: var(--line-soft);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 12px;
  color: var(--ink);
}
.step-item.critical .step-text .step-title { color: #C76B00; }

/* ----- Result document — the formatted page that becomes the PDF handed to
   Simon. Visible on screen on the confirm stage so it can be checked before
   printing; on print, everything else on the page is hidden and this is what
   fills the page. ----- */
.result-doc {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 40px 44px;
  max-width: 760px;
  margin: 0 auto;
}
.result-doc .doc-rule { height: 4px; background: var(--rs-red); margin: 0 0 18px; }
.result-doc .doc-eyebrow { font-size: 11px; letter-spacing: 1.5px; font-weight: 700; color: var(--rs-red); text-transform: uppercase; margin-bottom: 6px; }
.result-doc h1 { margin: 0 0 4px; }
.result-doc .doc-sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 22px; }
.result-doc .doc-meta-row { display: grid; grid-template-columns: 140px 1fr; font-size: 13px; padding: 3px 0; color: var(--ink-soft); }
.result-doc .doc-meta-row b { color: var(--ink); }
.result-doc .doc-section { margin: 22px 0 0; }
.result-doc .doc-section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--rs-navy); border-bottom: 2px solid var(--line-soft); padding-bottom: 6px; margin: 0 0 10px; }
.result-doc .doc-q { font-size: 13px; font-weight: 700; color: var(--ink); margin: 14px 0 4px; }
.result-doc .doc-a { font-size: 14px; color: var(--ink-soft); line-height: 1.6; white-space: pre-wrap; }
.result-doc .doc-a i { color: var(--ink-mute); }
.result-doc .doc-score { display: inline-block; margin-left: 8px; font-size: 11px; font-weight: 700; color: var(--rs-navy); }
.result-doc .doc-footer { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--line-soft); font-size: 11px; color: var(--ink-mute); }

/* ----- Data block — the machine-readable payload, embedded so the dashboard
   can read it back out of the printed PDF. Invisible on screen; printed on
   its own page at the end of the PDF. ----- */
.data-block { display: none; }
.data-block .data-note { font-size: 10px; color: #888; margin: 0 0 6px; }
.data-block pre {
  font-family: 'Courier New', Courier, monospace;
  font-size: 8.5px;
  line-height: 1.35;
  white-space: pre;
  word-break: normal;
  overflow-wrap: normal;
}

@media print {
  @page { margin: 1in; }
  body { background: #fff !important; }
  .topbar, .stage-bar, .autosave, .resume-banner, .print-hide { display: none !important; }
  .shell { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
  .result-doc { border: none !important; box-shadow: none !important; padding: 0 !important; margin: 0 !important; max-width: 100% !important; }
  .data-block { display: block !important; page-break-before: always; }
}
</style>
</head>

<header class="topbar">
  <div class="crest" id="brand-crest">RS</div>
  <div class="brand">
    <b id="brand-name">Red Sox</b><span class="sep">·</span>
    <span id="brand-dept">S&amp;C · Player Development</span><span class="sep">·</span>
    <span>Early-season checkpoint</span>
  </div>
</header>

<div class="shell">
  <div id="stage-bar" class="stage-bar"></div>
  <div id="root"></div>
</div>

<div class="autosave" id="autosave">Saved</div>

<script>
//==============================================================================
// CONFIG — adjust BRAND + WEBHOOK_URL to rebrand or wire up your Google Sheet
//==============================================================================
const BRAND = {
  org:        'Boston Red Sox',
  orgShort:   'Red Sox',
  orgLabel:   'RED SOX',
  dept:       'S&C · Player Development',
  deptShort:  'S&C',
  app:        'Coach Performance & Development Platform',
  appShort:   'Coach development',
  primary:        '#BD3039',
  primaryDark:    '#8C2128',
  secondary:      '#0C2340',
  secondaryLight: '#1A3357',
  emailDomain:    'redsox.com',
  emailSender:    'ecoleman@redsox.com',
};

// Paste your deployed Google Apps Script web-app URL here. If left blank or if
// the request fails, the form falls back to a JSON download that the coach
// emails back. See google_apps_script_setup.md for the 10-min setup.
//==============================================================================
// BACKEND — auto-email + Sheet write on submit.
// Paste the deployed Apps Script Web App URL and the form_key here.
// Leave BACKEND_URL empty to disable the backend path and fall back to the
// JSON download + mailto flow.
//==============================================================================
const BACKEND_URL = ''; // e.g. 'https://script.google.com/macros/s/AKfycb.../exec'
const FORM_KEY    = ''; // from getFormKey() in the Apps Script editor

const CHECKPOINT_LABEL = 'Early-season checkpoint';
const SEASON_TAG = '2026 — Early season';

// (No pre-seeded coach list — every coach enters their own First + Last + Email
// so responses tag back to a real person, not a placeholder.)

//==============================================================================
// TAXONOMY — mirrors the platform exactly so responses feed straight back
//==============================================================================
const PROFESSIONAL_TAXONOMY = [
  { id: 'sc-knowledge', name: 'S&C knowledge & application',
    intro: 'Your technical knowledge and how you apply it in programming and physical preparation.',
    focuses: [
      { id: 'warmups',        name: 'Warm-ups & prep',     hint: 'Movement prep, activation, pre-session readiness.' },
      { id: 'strength',       name: 'Strength',            hint: 'Strength training prescription, exercise selection, intensity.' },
      { id: 'power',          name: 'Power',               hint: 'Power development, force-velocity, plyometrics.' },
      { id: 'speed',          name: 'Speed',               hint: 'Acceleration, max velocity, change of direction.' },
      { id: 'fitness',        name: 'Fitness',             hint: 'Conditioning, energy systems, work capacity.' },
      { id: 'assessment',     name: 'Assessment skills',   hint: 'Testing, movement screens, interpreting data.' },
      { id: 'program-design', name: 'Program design',      hint: 'Periodization, individualization, integration with PD.' }
    ]
  },
  { id: 'coaching', name: 'Coaching effectiveness',
    intro: 'How you deliver, manage your environment, and adapt to the sport demands.',
    focuses: [
      { id: 'instruction',  name: 'Coaching & instruction', hint: 'Cueing, demonstration, athlete engagement, session flow.' },
      { id: 'tech-data',    name: 'Tech & data',            hint: 'Force plates, GPS, VBT, software competence.' },
      { id: 'schedule',     name: 'Schedule management',    hint: 'Session planning, time on task, daily/weekly flow.' },
      { id: 'sport-spec',   name: 'Sport-specific',         hint: 'Baseball context, position needs, integration with skill staff.' }
    ]
  },
  { id: 'universal', name: 'Universal competencies',
    intro: 'Cross-cutting professional habits — evidence, problem solving, presence on staff.',
    focuses: [
      { id: 'evidence',   name: 'Evidence-based',     hint: 'Use of research, willingness to update views.' },
      { id: 'innovation', name: 'Innovation & risk',  hint: 'Trying new methods responsibly, measuring impact.' },
      { id: 'problem',    name: 'Problem solver',     hint: 'Diagnosing issues, generating solutions under constraints.' },
      { id: 'modelling',  name: 'Modelling & growth', hint: 'Setting the standard, self-development, humility.' },
      { id: 'team-comm',  name: 'Team communication', hint: 'Cross-department collaboration, reporting, written + verbal.' }
    ]
  }
];

// Personal section — 4 main categories only, 1-5 scale with a single comment each.
const PERSONAL_MAIN = [
  { id: 'wellbeing', name: 'Wellbeing',
    examples: 'Sleep, nutrition, exercise, injury/pain, mental wellbeing, social and financial wellbeing.' },
  { id: 'resilience', name: 'Resilience',
    examples: 'Sense of self and purpose, personal challenge, social support, mindset, emotional regulation, adaptability, recoverability.' },
  { id: 'cognitive', name: 'Cognitive & interpersonal',
    examples: 'Critical thinking, creativity, learning, leadership and teamwork, emotional intelligence, communication.' },
  { id: 'life-mgmt', name: 'Life management',
    examples: 'Daily routine, daily environment, organization, life admin.' }
];

// 20-80 scoring scale anchors (MLB scouting style)
const PRO_SCALE = [20, 30, 40, 50, 60, 70, 80];
const PRO_SCALE_DESCRIPTIONS = {
  20: 'Developing — clear growth area',
  30: 'Approaching standard',
  40: 'Below pro baseline',
  50: 'Solid pro standard',
  60: 'Above standard',
  70: 'Approaching elite',
  80: 'Elite / mastery'
};

const PERSONAL_SCALE = [1, 2, 3, 4, 5];
const PERSONAL_SCALE_DESCRIPTIONS = {
  1: 'Struggling significantly',
  2: 'Some difficulty',
  3: 'OK / managing',
  4: 'Good',
  5: 'Thriving'
};

//==============================================================================
// STATE
//==============================================================================
const STORAGE_KEY = 'coach_checkpoint_v1_draft';
const state = {
  stage: 0,
  identity: { firstName: '', lastName: '', name: '', email: '', role: '', date: new Date().toISOString().slice(0, 10), seasonNote: '' },
  pro: {},        // focusId -> score
  proComments: {}, // pillarId -> text
  personal: {},   // categoryId -> score
  personalComments: {}, // categoryId -> text
  finalComment: '',
  submittedAt: null,
  responseId: null
};

// Stage order
const STAGES = [
  'welcome',
  'identify',
  ...PROFESSIONAL_TAXONOMY.map(p => `pro:${p.id}`),
  'personal',
  'review',
  'confirm'
];

//==============================================================================
// PERSISTENCE
//==============================================================================
function saveDraft() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      stage: state.stage,
      identity: state.identity,
      pro: state.pro,
      proComments: state.proComments,
      personal: state.personal,
      personalComments: state.personalComments,
      finalComment: state.finalComment
    }));
    showAutosave();
  } catch (e) { /* ignore quota */ }
}
function loadDraft() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    Object.assign(state.identity, d.identity || {});
    state.pro = d.pro || {};
    state.proComments = d.proComments || {};
    state.personal = d.personal || {};
    state.personalComments = d.personalComments || {};
    state.finalComment = d.finalComment || '';
    return Object.keys(state.pro).length > 0 || state.identity.firstName || state.identity.lastName || state.identity.email;
  } catch (e) { return false; }
}
function clearDraft() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}
let autosaveTimer = null;
function showAutosave() {
  const el = document.getElementById('autosave');
  if (!el) return;
  el.classList.add('show');
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => el.classList.remove('show'), 1200);
}

//==============================================================================
// HELPERS
//==============================================================================
function pillarById(id) { return PROFESSIONAL_TAXONOMY.find(p => p.id === id); }
function focusById(id) {
  for (const p of PROFESSIONAL_TAXONOMY) {
    const f = p.focuses.find(x => x.id === id);
    if (f) return { focus: f, pillar: p };
  }
  return null;
}
function pillarAverage(pillarId) {
  const p = pillarById(pillarId);
  const scores = p.focuses.map(f => state.pro[f.id]).filter(v => typeof v === 'number');
  if (!scores.length) return null;
  return Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
}
function overallProAverage() {
  const scores = Object.values(state.pro).filter(v => typeof v === 'number');
  if (!scores.length) return null;
  return Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
}
function overallPersonalAverage() {
  const scores = Object.values(state.personal).filter(v => typeof v === 'number');
  if (!scores.length) return null;
  return (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1);
}
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function applyBrand() {
  const r = document.documentElement.style;
  r.setProperty('--rs-red', BRAND.primary);
  r.setProperty('--rs-red-dark', BRAND.primaryDark);
  r.setProperty('--rs-navy', BRAND.secondary);
  r.setProperty('--rs-navy-light', BRAND.secondaryLight);
  document.title = `${BRAND.orgShort} ${BRAND.deptShort} — Coach checkpoint`;
  document.getElementById('brand-name').textContent  = BRAND.orgShort;
  document.getElementById('brand-dept').textContent  = BRAND.dept;
  document.getElementById('brand-crest').textContent = BRAND.orgShort.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
}

function renderProScale(focusId, current) {
  const desc = current != null ? PRO_SCALE_DESCRIPTIONS[current] : 'Tap to score';
  return `
    <div class="scale-row" data-focus="${focusId}">
      <div class="scale-pills" role="radiogroup" aria-label="Score for ${focusId}">
        ${PRO_SCALE.map(v => `
          <button type="button"
            class="scale-pill ${current === v ? 'selected' : ''}"
            data-val="${v}"
            onclick="setPro('${focusId}', ${v})"
            aria-checked="${current === v}">${v}</button>
        `).join('')}
      </div>
      <div class="scale-meta" id="meta-${focusId}">${escapeHtml(desc)}</div>
    </div>
  `;
}

function renderPersonalScale(catId, current) {
  const desc = current != null ? PERSONAL_SCALE_DESCRIPTIONS[current] : 'Tap to score';
  return `
    <div class="scale-row" data-cat="${catId}">
      <div class="scale-pills" role="radiogroup" aria-label="Score for ${catId}">
        ${PERSONAL_SCALE.map(v => `
          <button type="button"
            class="scale-pill ${current === v ? 'selected' : ''}"
            data-val="${v}"
            onclick="setPersonal('${catId}', ${v})"
            aria-checked="${current === v}">${v}</button>
        `).join('')}
      </div>
      <div class="scale-meta" id="meta-personal-${catId}">${escapeHtml(desc)}</div>
    </div>
  `;
}

function setPro(focusId, val) {
  state.pro[focusId] = val;
  const info = focusById(focusId);
  // Update pills
  document.querySelectorAll(`.scale-row[data-focus="${focusId}"] .scale-pill`).forEach(p => {
    p.classList.toggle('selected', Number(p.dataset.val) === val);
  });
  document.getElementById(`meta-${focusId}`).textContent = PRO_SCALE_DESCRIPTIONS[val];
  // Update pillar avg chip
  const chip = document.getElementById(`avg-${info.pillar.id}`);
  if (chip) chip.innerHTML = renderAvgChipInner(info.pillar.id);
  saveDraft();
}

function setPersonal(catId, val) {
  state.personal[catId] = val;
  document.querySelectorAll(`.scale-row[data-cat="${catId}"] .scale-pill`).forEach(p => {
    p.classList.toggle('selected', Number(p.dataset.val) === val);
  });
  document.getElementById(`meta-personal-${catId}`).textContent = PERSONAL_SCALE_DESCRIPTIONS[val];
  saveDraft();
}

function renderAvgChipInner(pillarId) {
  const avg = pillarAverage(pillarId);
  const total = pillarById(pillarId).focuses.length;
  const filled = pillarById(pillarId).focuses.filter(f => typeof state.pro[f.id] === 'number').length;
  if (avg == null) {
    return `<span class="label">Pillar average</span><span>—</span><span class="label">${filled}/${total} scored</span>`;
  }
  return `<span class="label">Pillar average</span><b>${avg}</b><span class="label">${filled}/${total} scored</span>`;
}

//==============================================================================
// RESULT DOCUMENT + EMBEDDED DATA BLOCK
// The printable page is the actual deliverable in the manual (no-backend)
// path: a clean, readable record of one coach's checkpoint, with the
// structured payload embedded at the end (visible only when printed) so the
// dashboard can read it back out of the PDF. Base64 is used, hard-wrapped at
// a fixed width with real line breaks, specifically so it survives being
// reflowed and re-extracted as text from a PDF.
//==============================================================================
function utf8ToBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function wrapText(str, width) {
  const lines = [];
  for (let i = 0; i < str.length; i += width) lines.push(str.slice(i, i + width));
  return lines.join('\n');
}
function buildDataBlockHtml(payload) {
  const b64 = utf8ToBase64(JSON.stringify(payload));
  const wrapped = wrapText(b64, 60);
  return `
    <div class="data-block">
      <p class="data-note">For the dashboard import &mdash; structured data below. Please keep this page in the saved PDF; do not edit it.</p>
      <pre>---BEGIN-CHECKPOINT-DATA---
${wrapped}
---END-CHECKPOINT-DATA---</pre>
    </div>
  `;
}

function renderResultDoc(payload) {
  if (!payload) return '';
  const id = payload;
  const scoreTag = (v) => v != null ? `<span class="doc-score">${v}/5</span>` : '';
  return `
    <div class="result-doc" id="result-doc">
      <div class="doc-rule"></div>
      <div class="doc-eyebrow">${escapeHtml(BRAND.orgLabel)} &middot; ${escapeHtml(CHECKPOINT_LABEL)}</div>
      <h1>Coach Checkpoint</h1>
      <div class="doc-sub">${escapeHtml(payload.name)} &middot; submitted ${escapeHtml((payload.submittedAt || '').slice(0, 10))}</div>

      <div class="doc-meta-row"><b>Coach</b><span>${escapeHtml(payload.name)} &middot; ${escapeHtml(payload.email)}</span></div>
      <div class="doc-meta-row"><b>Role</b><span>${escapeHtml(payload.role)}</span></div>
      <div class="doc-meta-row"><b>Date</b><span>${escapeHtml(payload.date)}</span></div>
      <div class="doc-meta-row"><b>Response ID</b><span>${escapeHtml(payload.responseId)}</span></div>
      ${payload.seasonNote ? `<div class="doc-meta-row"><b>Where in calendar</b><span>${escapeHtml(payload.seasonNote)}</span></div>` : ''}

      ${PROFESSIONAL_TAXONOMY.map(p => `
        <div class="doc-section">
          <h3>${escapeHtml(p.name)} &mdash; avg ${payload.professional.pillarAverages[p.id] ?? '—'}</h3>
          ${p.focuses.map(f => `<div class="doc-q">${escapeHtml(f.name)}<span class="doc-score">${payload.professional.scores[f.id] ?? '—'}</span></div>`).join('')}
          <div class="doc-q" style="margin-top:10px;">Reflection</div>
          <div class="doc-a">${payload.professional.comments[p.id] && payload.professional.comments[p.id].trim() ? escapeHtml(payload.professional.comments[p.id]) : '<i>Not answered.</i>'}</div>
        </div>
      `).join('')}

      <div class="doc-section">
        <h3>Personal &mdash; avg ${payload.personal.overallAverage ?? '—'} / 5</h3>
        ${PERSONAL_MAIN.map(c => `
          <div class="doc-q">${escapeHtml(c.name)}${scoreTag(payload.personal.scores[c.id])}</div>
          <div class="doc-a">${payload.personal.comments[c.id] && payload.personal.comments[c.id].trim() ? escapeHtml(payload.personal.comments[c.id]) : '<i>Not answered.</i>'}</div>
        `).join('')}
      </div>

      ${payload.finalComment ? `
        <div class="doc-section">
          <h3>Final comment</h3>
          <div class="doc-a">${escapeHtml(payload.finalComment)}</div>
        </div>` : ''}

      <div class="doc-footer">
        Completed by the coach named above. For Simon only &mdash; not shared beyond the department leadership team.
      </div>
    </div>
    ${buildDataBlockHtml(payload)}
  `;
}

function printResult() {
  const prevTitle = document.title;
  if (state.printName) document.title = state.printName;
  window.print();
  setTimeout(() => { document.title = prevTitle; }, 1000);
}

function downloadBackupJson() {
  if (!state._lastPayload) return;
  downloadJson(state._lastPayload, state.downloadName || 'checkpoint.json');
}

function emailToSimon() {
  const payload = state._lastPayload;
  const id = state.identity;
  const subject = `Coach checkpoint (PDF) — ${id.name}`;
  const lines = [
    `Hi Simon,`, ``,
    `[ Please attach the PDF you just saved before sending — it does not attach automatically. ]`, ``,
    `Coach:        ${id.name} <${id.email}>`,
    `Role:         ${id.role}`,
    `Date:         ${id.date}`,
    `Response ID:  ${payload ? payload.responseId : (state.responseId || '')}`, ``,
    `Thanks,`, `${id.name}`,
  ];
  const body = lines.join('\n');
  const mailto = `mailto:${encodeURIComponent(BRAND.emailSender)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.location.href = mailto;
}

function resetForm() {
  if (!confirm('Clear the form and start over? This will wipe the current draft.')) return;
  clearDraft();
  state.stage = 0;
  state.identity = { firstName: '', lastName: '', name: '', email: '', role: '', date: new Date().toISOString().slice(0, 10), seasonNote: '' };
  state.pro = {};
  state.proComments = {};
  state.personal = {};
  state.personalComments = {};
  state.finalComment = '';
  state.submittedAt = null;
  state.responseId = null;
  state.deliveredVia = null;
  state._lastPayload = null;
  state.downloadName = null;
  state.printName = null;
  render();
}

//==============================================================================
// NAVIGATION
//==============================================================================
function goNext() {
  if (state.stage < STAGES.length - 1) {
    state.stage++;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    saveDraft();
  }
}
function goPrev() {
  if (state.stage > 0) {
    state.stage--;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    saveDraft();
  }
}

//==============================================================================
// SUBMIT
//==============================================================================
function buildPayload() {
  // Build the flat payload for the sheet + a structured version for the dashboard.
  // coachId is derived from the email (everything before @, lower-case) — it's
  // stable across re-submissions so the dashboard can dedupe per coach.
  const id = state.identity;
  const coachId = (id.email || '').split('@')[0].toLowerCase().replace(/[^a-z0-9._-]/g, '-') || 'unknown';
  const responseId = `${coachId}-${Date.now().toString(36)}`;
  const submittedAt = new Date().toISOString();

  const proByFocus = {};
  PROFESSIONAL_TAXONOMY.forEach(p => p.focuses.forEach(f => {
    proByFocus[f.id] = state.pro[f.id] ?? null;
  }));
  const proPillarAvgs = {};
  PROFESSIONAL_TAXONOMY.forEach(p => { proPillarAvgs[p.id] = pillarAverage(p.id); });

  const personalScores = {};
  PERSONAL_MAIN.forEach(c => { personalScores[c.id] = state.personal[c.id] ?? null; });

  return {
    schemaVersion: 1,
    kind: 'checkpoint',
    responseId,
    submittedAt,
    checkpoint: CHECKPOINT_LABEL,
    season: SEASON_TAG,
    coachId,
    name: id.name,
    firstName: id.firstName,
    lastName: id.lastName,
    email: id.email,
    role: id.role,
    date: id.date,
    seasonNote: id.seasonNote || '',
    professional: {
      scores: proByFocus,
      pillarAverages: proPillarAvgs,
      overallAverage: overallProAverage(),
      comments: { ...state.proComments }
    },
    personal: {
      scores: personalScores,
      overallAverage: parseFloat(overallPersonalAverage()) || null,
      comments: { ...state.personalComments }
    },
    finalComment: state.finalComment || '',
    brand: BRAND.org
  };
}

async function downloadJson(payload, name) {
  const jsonStr = JSON.stringify(payload, null, 2);
  // Inside the Claude artifact preview, a plain <a download> link is inert —
  // the sandbox never grants pages direct file-save permission. Use the
  // `downloads` capability there instead. Once this page is deployed on its
  // own (GitHub Pages, Netlify, an internal server), window.claude will not
  // exist at all and this falls straight through to the classic browser
  // download below, unchanged from how it always worked.
  if (typeof window !== 'undefined' && window.claude && typeof window.claude.use === 'function') {
    try {
      const downloads = await window.claude.use('downloads');
      if (downloads) {
        await downloads.save({ filename: name, data: jsonStr });
        return;
      }
    } catch (e) {
      console.warn('downloads capability save unavailable/declined, falling back to browser download', e);
    }
  }
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 250);
}

async function onConfirm() {
  const btn = document.getElementById('submit-btn');
  const status = document.getElementById('submit-status');
  btn.disabled = true;
  btn.textContent = 'Confirming…';
  if (status) status.textContent = '';

  const payload = buildPayload();
  state._lastPayload = payload;
  const safeId = (payload.coachId || 'unknown').replace(/[^a-z0-9]+/gi, '-');
  const baseName = `checkpoint_${safeId}_${state.identity.date}`;
  state.downloadName = baseName + '.json';
  state.printName = baseName;

  let delivered = null;

  // Try the backend first — auto-emails Simon and writes to the Sheet. Falls
  // back to the print/PDF flow if the backend is unreachable or unset (which
  // is the only path right now — no backend is configured), so no submission
  // is ever lost.
  if (BACKEND_URL && BACKEND_URL.startsWith('http') && FORM_KEY) {
    try {
      if (status) status.textContent = 'Sending securely to Simon…';
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'submit_feedback_form',
          form_key: FORM_KEY,
          form_type: 'checkpoint',
          submission: payload
        }),
        redirect: 'follow'
      });
      if (res.ok) {
        const txt = await res.text();
        let j = null;
        try { j = JSON.parse(txt); } catch (_) {}
        if (j && j.ok) delivered = 'backend';
      }
    } catch (e) {
      console.warn('Backend send failed, falling back to the print/PDF flow', e);
    }
  }

  if (!delivered) {
    // Manual path: no download here — the confirm/result stage shows the
    // printable document and the coach prints and emails it to Simon.
    delivered = 'print';
  }

  state.submittedAt = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
  state.responseId = payload.responseId;
  state.deliveredVia = delivered;

  // Clear the draft now that it's been submitted successfully.
  clearDraft();

  state.stage = STAGES.length - 1;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

//==============================================================================
// MAIN RENDER
//==============================================================================
function renderStageBar() {
  // Welcome and confirm don't count as steps
  const numSteps = STAGES.length - 2;
  const currentStep = state.stage === 0 ? 0 : (state.stage === STAGES.length - 1 ? numSteps + 1 : state.stage);
  const pips = [];
  for (let i = 1; i <= numSteps; i++) {
    let cls = '';
    if (i < currentStep) cls = 'done';
    else if (i === currentStep) cls = 'active';
    pips.push(`<div class="pip ${cls}"></div>`);
  }
  document.getElementById('stage-bar').innerHTML = pips.join('');
}

function render() {
  const stageKey = STAGES[state.stage];
  let html = '';
  if (stageKey === 'welcome') html = renderWelcome();
  else if (stageKey === 'identify') html = renderIdentify();
  else if (stageKey.startsWith('pro:')) html = renderProPillar(stageKey.slice(4));
  else if (stageKey === 'personal') html = renderPersonal();
  else if (stageKey === 'review') html = renderReview();
  else if (stageKey === 'confirm') html = renderConfirm();
  document.getElementById('root').innerHTML = html;
  renderStageBar();
}

//==============================================================================
// INIT
//==============================================================================
// Expose state on window for dev console / smoke tests
if (typeof window !== 'undefined') window.state = state;

applyBrand();

const hadDraft = loadDraft();
if (hadDraft) {
  // Show resume banner before they navigate
  const banner = document.createElement('div');
  banner.className = 'resume-banner';
  banner.innerHTML = `
    <span><b>Welcome back.</b> We found a draft in progress &mdash; pick up where you left off?</span>
    <div>
      <button onclick="this.parentElement.parentElement.remove(); render();">Resume</button>
      <button onclick="if(confirm('Discard saved draft and start over?')) { clearDraft(); location.reload(); }" style="background:transparent; color:#6b4f0c; border:1px solid #6b4f0c; margin-left:6px;">Start over</button>
    </div>
  `;
  document.querySelector('.shell').insertBefore(banner, document.getElementById('stage-bar'));
  // Don't auto-render yet — wait for them to click Resume / Start over
  // Actually, render anyway so they see context; the banner gives them the option
  render();
} else {
  render();
}

// Save draft on any text input change (safety net)
document.addEventListener('input', e => {
  if (e.target.matches('textarea, input[type=text]')) {
    // The individual oninput handlers already update state and saveDraft.
    // This is a no-op safety net.
  }
});
</script>
